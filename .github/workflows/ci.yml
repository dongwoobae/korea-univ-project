name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration file history
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-migrations.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test

  e2e:
    name: Test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  migrate:
    name: Apply Supabase migrations
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.migration-safety.outputs.has_changes == 'true'
    needs: [migration-safety, lint, format, typecheck, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL_TEMPLATE: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Build masked database connection
        shell: bash
        run: bash scripts/build-supabase-db-url.sh

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_MIGRATION_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_MIGRATION_DB_URL" --yes

  verify-migration-history:
    name: Verify migration history
    # migrate 성공 또는 정상 skip 후에 돈다. always()가 없으면 has_changes=false로
    # migrate가 skip되는 평상시에 검증도 함께 사라져 지금과 같은 사각지대가 된다.
    # pull_request에서는 돌리지 않는다 — 포크 PR에 secrets가 없어 항상 빨간불이 된다.
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.migrate.result != 'failure'
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL_TEMPLATE: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build masked database connection
        shell: bash
        run: bash scripts/build-supabase-db-url.sh

      - name: Compare migration files with applied versions
        shell: bash
        run: |
          set -euo pipefail

          # CLI 출력 포맷에 의존하지 않는다. supabase migration list --output json은
          # JSON 앞에 진행 메시지를 stdout으로 흘려 jq 파싱을 깨뜨린다.
          psql "$SUPABASE_MIGRATION_DB_URL" --no-align --tuples-only \
            --command "select version from supabase_migrations.schema_migrations" \
            | sed '/^$/d' | sort > /tmp/applied-versions.txt

          git ls-files 'supabase/migrations/*.sql' \
            | xargs -n1 basename \
            | sed 's/_.*//' \
            | sort > /tmp/local-versions.txt

          if ! diff -u /tmp/local-versions.txt /tmp/applied-versions.txt; then
            echo "::error::Local migration files and applied versions differ."
            exit 1
          fi
          echo "Local and remote migration histories match."
